name: marci_metzger_homes
description: A cinematic, responsive single-page website for Marci Metzger Homes.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/Cormorant-LICENSE.txt
    - assets/fonts/Manrope-LICENSE.txt
  fonts:
    - family: Cormorant
      fonts:
        - asset: assets/fonts/CormorantGaramond-Regular.ttf
        - asset: assets/fonts/CormorantGaramond-Italic.ttf
          style: italic
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
